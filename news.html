<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости — Вершина</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #f0f0f0; line-height: 1.6; }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        .gradient-ball { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.4; animation: float 20s infinite alternate; }
        .ball-1 { width: 40vw; height: 40vw; background: #7c3aed; top: -10%; left: -10%; }
        .ball-2 { width: 35vw; height: 35vw; background: #ff007f; bottom: -10%; right: -5%; animation-duration: 25s; }
        .ball-3 { width: 25vw; height: 25vw; background: #00c6ff; top: 40%; left: 60%; animation-duration: 18s; }
        @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(5%,5%) scale(1.1); } }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .site-header { padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(10,10,15,0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .brand-link { text-decoration: none; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-title { font-size: 1.7rem; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg,#FFDE00,#FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .brand-subtitle { font-size: 0.7rem; opacity: 0.7; }
        .site-nav { display: flex; gap: 28px; }
        .nav-link { color: #ddd; text-decoration: none; font-weight: 500; transition: 0.2s; }
        .nav-link:hover, .nav-active { color: #FFDE00; }
        .profile-dropdown { position: relative; }
        .profile-dropbtn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 40px; color: white; cursor: pointer; font-weight: 500; }
        .profile-dropdown-content { display: none; position: absolute; right: 0; background: #1e1e2a; min-width: 180px; border-radius: 12px; border: 1px solid #333; z-index: 10; }
        .profile-dropdown:hover .profile-dropdown-content { display: block; }
        .profile-dropdown-content a { display: block; padding: 10px 16px; color: white; text-decoration: none; border-bottom: 1px solid #2a2a35; }
        .profile-dropdown-content a:hover { background: #FFDE0022; color: #FFDE00; }
        .hero { text-align: center; padding: 60px 0 40px; }
        .hero-title { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg,#fff,#FFDE00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .section { padding: 40px 0; }
        .text-accent { color: #FFDE00; margin-bottom: 16px; }
        .btn-primary { background: #FFDE00; color: #0a0a0f; padding: 10px 24px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .btn-primary:hover { background: #ffc107; transform: scale(1.02); }
        .news-grid { display: grid; gap: 25px; margin-top: 20px; }
        .news-card { background: rgba(20,20,28,0.8); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 25px; transition: transform 0.3s ease; }
        .news-card:hover { transform: translateY(-5px); }
        .news-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 10px; }
        .news-date { color: #aaa; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .news-text { line-height: 1.6; margin-bottom: 15px; white-space: pre-wrap; }
        .news-images { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .news-images img { max-width: 200px; max-height: 150px; object-fit: cover; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); }
        .site-badge { background: #FFDE00; color: #0a0a0f; display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 10px; }
        .loading-spinner, .error-message { text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #FFDE00; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { text-align: center; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 40px; }
        @media (max-width: 768px) { .news-images img { max-width: 100%; height: auto; } }
    </style>
</head>
<body>
<div class="animated-bg"><div class="gradient-ball ball-1"></div><div class="gradient-ball ball-2"></div><div class="gradient-ball ball-3"></div></div>
<header class="site-header"><div class="header-inner"><a href="index.html" class="brand-link"><div class="brand"><div class="brand-title">ВЕРШИНА</div><div class="brand-subtitle">СПОРТАРЕНА</div></div></a><nav class="site-nav"><a href="index.html" class="nav-link">Главная</a><a href="news.html" class="nav-link nav-active">Новости</a><a href="vk-panel.html" class="nav-link">Публикации ВК</a><a href="admin.html" class="nav-link">Админ-панель</a></nav><div class="profile-dropdown"><button class="profile-dropbtn" id="adminProfileBtn"><span id="adminName">Администратор</span></button><div class="profile-dropdown-content"><a href="profile.html">👤 Профиль</a><a href="admin.html">⚙️ Админ-панель</a><a href="vk-panel.html">📱 Публикации Вконтакте</a><a href="#" id="logoutBtn">🚪 Выйти</a></div></div></div></header>
<section class="hero"><div class="container"><h1 class="hero-title">НОВОСТИ КЛУБА</h1><p>Актуальные новости, созданные администратором</p></div></section>
<section class="section"><div class="container"><div style="text-align: center; margin-bottom: 30px;"><button class="btn-primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Обновить новости</button></div>
<h2 class="text-accent"><i class="fas fa-globe"></i> Новости клуба (с сайта)</h2><div id="siteNewsContainer" class="news-grid"><div class="loading-spinner"><div class="spinner"></div><p>Загрузка новостей...</p></div></div></div></section>
<footer class="footer"><div class="container"><p>© 2025 Вершина — Спортивный клуб. Все права защищены.</p></div></footer>

<script>
(function() {
    const container = document.getElementById('siteNewsContainer');
    const refreshBtn = document.getElementById('refreshBtn');

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatText(text) {
        if (!text) return '';
        let formatted = escapeHtml(text).replace(/\n/g, '<br>');
        formatted = formatted.replace(/#([А-Яа-яA-Za-z0-9_]+)/g, '<span style="color:#FFDE00;">#$1</span>');
        formatted = formatted.replace(/(https?:\/\/[^\s<]+)/g, url => `<a href="${url}" target="_blank" style="color:#FFDE00;">${url}</a>`);
        return formatted;
    }

    function renderSiteNews() {
        const siteNews = JSON.parse(localStorage.getItem('site_news_array') || '[]');
        if (!siteNews.length) {
            container.innerHTML = '<div class="error-message">Пока нет новостей. Добавьте их через панель управления.</div>';
            return;
        }
        siteNews.sort((a,b) => new Date(b.date) - new Date(a.date));
        let html = '';
        for (const news of siteNews) {
            const dateStr = new Date(news.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const text = formatText(news.text);
            let imagesHtml = '';
            if (news.images && news.images.length) {
                imagesHtml = '<div class="news-images">' + news.images.slice(0,4).map(img => `<img src="${img}" loading="lazy" alt="Фото">`).join('') + '</div>';
            }
            html += `
                <div class="news-card">
                    <div class="site-badge"><i class="fas fa-globe"></i> Новость сайта</div>
                    <div class="news-header">
                        <div class="news-date"><i class="far fa-calendar-alt"></i> ${dateStr}</div>
                    </div>
                    <div class="news-text">${text}</div>
                    ${imagesHtml}
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function loadNews() {
        container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Загрузка...</p></div>';
        renderSiteNews();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadNews();
        if (refreshBtn) refreshBtn.addEventListener('click', loadNews);
        // Админская часть (для отображения имени)
        const savedUser = localStorage.getItem('current_user');
        const adminNameSpan = document.getElementById('adminName');
        if (savedUser && adminNameSpan) {
            try {
                const user = JSON.parse(savedUser);
                adminNameSpan.textContent = `${user.firstName} ${user.lastName}`;
            } catch(e) {}
        }
        const logout = document.getElementById('logoutBtn');
        if (logout) {
            logout.addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('Выйти?')) {
                    localStorage.removeItem('current_user');
                    localStorage.removeItem('admin_logged_in');
                    window.location.href = 'index.html';
                }
            });
        }
        if (!localStorage.getItem('current_user')) {
            localStorage.setItem('current_user', JSON.stringify({ firstName: 'Администратор', lastName: 'Вершины', isAdmin: true }));
            localStorage.setItem('admin_logged_in', 'true');
            if (adminNameSpan) adminNameSpan.textContent = 'Администратор Вершины';
        }
    });
})();
</script>
</body>
</html>
